<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T&T | Marketing, Comunicación y Transformación</title>
  <meta name="description" content="Agencia de marketing en Madrid con alcance global. T&T: creatividad, tecnología, estrategia, talento y eventos para marcas que buscan transformación real.">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A0A0A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 16px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Redirigiendo...</p>
  </div>

  <script>
    (function() {
      // Get browser language from Accept-Language header (fallback)
      // or from navigator.language
      const browserLang = navigator.language || navigator.userLanguage || '';

      // Check if browser language starts with 'en'
      const isEnglish = browserLang.toLowerCase().startsWith('en');

      // Redirect to appropriate language version
      const targetPath = isEnglish ? '/en/' : '/es/';

      // Use location.replace to avoid adding to browser history
      window.location.replace(targetPath);
    })();
  </script>
</body>
</html>
